name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  id-token: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Check bundle size
        run: pnpm size

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:packages

      - name: Remove stale empty Changesets release branch
        run: |
          if git ls-remote --exit-code --heads origin changeset-release/master >/dev/null 2>&1; then
            git fetch origin changeset-release/master
            if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then
              git push origin --delete changeset-release/master
            fi
          fi

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1.7.0
        with:
          publish: pnpm run release
          version: pnpm run version
          branch: master
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    env:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Warn when Pages auto-enable token is missing
        if: env.PAGES_TOKEN == ''
        run: |
          echo "::warning::PAGES_TOKEN is not configured. GitHub Pages must already be enabled with source set to GitHub Actions, or configure-pages will fail."

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: ${{ env.PAGES_TOKEN != '' }}
          token: ${{ env.PAGES_TOKEN != '' && env.PAGES_TOKEN || github.token }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Build website
        run: pnpm --filter ling-website build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
